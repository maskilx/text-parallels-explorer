name: Verify workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify backend
        run: python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start workspace
        env:
          DATABASE_PATH: /tmp/explorer-ci.sqlite
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/explorer-ci.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Workspace did not become healthy')
          PY
      - name: Verify browser workflows and responsive layouts
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: frontend/test-results/
          retention-days: 7
